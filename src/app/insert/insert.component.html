<div fxLayout="row" fxLayoutAlign="center">
    <div fxLayout="column" fxFlex="900px">
        <form class="mt-60" #clientesFom="ngForm" (ngSubmit)="logObject()">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>Dados Pessoas</mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-60">
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="20px">
                        <div fxLayout="column" fxFlex="800px">
                            <mat-form-field class="full-width">
                                <mat-label> Nome: *</mat-label>
                                <input type="text" 
                                        placeholder="Ex: João da Silva" 
                                        [(ngModel)]="client.name"
                                        name="name"
                                matInput/>
                            </mat-form-field>
                        </div>
                    </div>    
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="800px">
                            <mat-form-field class="full-width">
                                <mat-label> Email: *</mat-label>
                                <input type="email" 
                                        placeholder="Ex: joaosilva@email.com" 
                                        [(ngModel)]="client.email"
                                        name="email"
                                        matInput/>
                            </mat-form-field>
                        </div>
                    </div> 
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="400px">
                            <mat-form-field class="full-width">
                                <mat-label> CPF: *</mat-label>
                                <input type="text" 
                                    placeholder="Digite seu CPF" 
                                    [(ngModel)]="client.cpf"
                                    name="cpf"
                                    matInput/>
                            </mat-form-field>
                        </div>
                    </div> 
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="400px">
                            <mat-form-field class="full-width">
                                <mat-label> Data de Nascimento: *</mat-label>
                                <input type="date" 
                                [(ngModel)]="client.birthDate"
                                name="birthDate"
                                placeholder="Selecione a sua data de Nascimento" 
                                matInput/>
                            </mat-form-field>
                        </div>
                    </div> 
                </mat-card-content>
                <mat-card-actions class="ml-5">
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <button mat-flat-button color="primary" type="submit">
                                <mat-icon fontIcon="save"></mat-icon>
                                Salvar
                            </button>
                        </div>
                        <div fxLayout="column">
                            <button mat-flat-button color="primary">
                                <mat-icon fontIcon="refresh"></mat-icon>
                                Atualizar
                            </button>
                        </div>
                        <div fxLayout="column">
                            <button mat-flat-button color="accent">
                                <mat-icon fontIcon="backspace"></mat-icon>
                                Limpar
                            </button>
                        </div>
                    </div>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
</div>
